[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dota-draft-assistant"
version = "0.1.0"
description = "Small local Dota 2 draft assistant"
requires-python = ">=3.12"

[project.scripts]
dota-pick = "draft_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
